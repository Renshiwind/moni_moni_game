<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Juego</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #1a202c;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            touch-action: none;
        }
        canvas {
            display: block;
            background: linear-gradient(to bottom, #87CEEB, #E0F6FF);
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
            margin: 0 auto;
        }
        .ui-layer {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #2d3748;
            font-size: 24px;
            font-weight: bold;
            pointer-events: none;
            text-shadow: 1px 1px 2px rgba(255,255,255,0.8);
        }
        #controls {
            position: absolute;
            bottom: 20px;
            left: 0;
            right: 0;
            display: flex;
            justify-content: space-between;
            padding: 0 20px;
            pointer-events: none;
        }
        .btn {
            width: 60px;
            height: 60px;
            background: rgba(255, 255, 255, 0.3);
            border: 2px solid rgba(255, 255, 255, 0.5);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            color: white;
            pointer-events: auto;
            user-select: none;
        }
        .btn:active {
            background: rgba(255, 255, 255, 0.5);
        }
        #message-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            z-index: 10;
        }
    </style>
</head>
<body>

    <div class="ui-layer">
        Monedas: <span id="coin-count">0</span>
    </div>

    <div id="message-overlay">
        <h1 id="status-title" class="text-4xl font-bold mb-4">¡Juego Terminado!</h1>
        <p id="status-desc" class="text-xl mb-6">Recogiste 0 monedas.</p>
        <button onclick="resetGame()" class="px-6 py-3 bg-blue-500 hover:bg-blue-600 rounded-full font-bold transition">Jugar de Nuevo</button>
    </div>

    <canvas id="gameCanvas"></canvas>

    <!-- Controles táctiles para móvil -->
    <div id="controls">
        <div class="flex gap-4">
            <div id="btn-left" class="btn">←</div>
            <div id="btn-right" class="btn">→</div>
        </div>
        <div id="btn-jump" class="btn">▲</div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const coinDisplay = document.getElementById('coin-count');
        const overlay = document.getElementById('message-overlay');
        const statusTitle = document.getElementById('status-title');
        const statusDesc = document.getElementById('status-desc');

        // Configuración del juego
        let gameActive = true;
        let score = 0;
        const gravity = 0.5;
        const friction = 0.8;

        // Estado de teclas
        const keys = {
            left: false,
            right: false,
            up: false
        };

        // Jugador
        const player = {
            x: 50,
            y: 300,
            width: 32,
            height: 32,
            velX: 0,
            velY: 0,
            speed: 5,
            jumpStrength: 10,
            grounded: false,
            color: '#3182ce'
        };

        // Elementos del nivel
        let platforms = [];
        let coins = [];
        let goal = { x: 0, y: 0, width: 40, height: 60 };

        function initLevel() {
            score = 0;
            coinDisplay.innerText = score;
            player.x = 50;
            player.y = 300;
            player.velX = 0;
            player.velY = 0;
            gameActive = true;
            overlay.style.display = 'none';

            // Definición de plataformas (x, y, width, height)
            platforms = [
                { x: 0, y: 380, w: 200, h: 40 },      // Inicio
                { x: 250, y: 320, w: 150, h: 20 },
                { x: 450, y: 250, w: 120, h: 20 },
                { x: 300, y: 150, w: 100, h: 20 },
                { x: 100, y: 120, w: 100, h: 20 },
                { x: 80, y: 300, w: 100, h: 20 },
                { x: 650, y: 300, w: 200, h: 40 },    // Zona meta
            ];

            // Monedas
            coins = [
                { x: 280, y: 280, collected: false },
                { x: 480, y: 210, collected: false },
                { x: 330, y: 110, collected: false },
                { x: 130, y: 80, collected: false },
                { x: 700, y: 260, collected: false },
                { x: 600, y: 260, collected: false },
                { x: 90, y: 280, collected: false },
                { x: 750, y: 260, collected: false }
            ];

            // Meta
            goal = { x: 780, y: 240, w: 40, h: 60 };
        }

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }

        window.addEventListener('resize', resize);
        resize();

        // Listeners de teclado
        window.addEventListener('keydown', e => {
            if (e.key === 'ArrowLeft' || e.key === 'a') keys.left = true;
            if (e.key === 'ArrowRight' || e.key === 'd') keys.right = true;
            if (e.key === 'ArrowUp' || e.key === 'w' || e.key === ' ') keys.up = true;
        });

        window.addEventListener('keyup', e => {
            if (e.key === 'ArrowLeft' || e.key === 'a') keys.left = false;
            if (e.key === 'ArrowRight' || e.key === 'd') keys.right = false;
            if (e.key === 'ArrowUp' || e.key === 'w' || e.key === ' ') keys.up = false;
        });

        // Controles táctiles
        const setupTouch = (id, key) => {
            const btn = document.getElementById(id);
            btn.addEventListener('touchstart', (e) => { e.preventDefault(); keys[key] = true; });
            btn.addEventListener('touchend', (e) => { e.preventDefault(); keys[key] = false; });
        };
        setupTouch('btn-left', 'left');
        setupTouch('btn-right', 'right');
        setupTouch('btn-jump', 'up');

        function resetGame() {
            initLevel();
        }

        function showMessage(title, desc) {
            gameActive = false;
            statusTitle.innerText = title;
            statusDesc.innerText = desc;
            overlay.style.display = 'flex';
        }

        function update() {
            if (!gameActive) return;

            // Movimiento lateral
            if (keys.right) {
                if (player.velX < player.speed) player.velX++;
            }
            if (keys.left) {
                if (player.velX > -player.speed) player.velX--;
            }

            player.velX *= friction;
            player.velY += gravity;

            player.grounded = false;

            // Colisión con plataformas
            for (let i = 0; i < platforms.length; i++) {
                let plat = platforms[i];
                
                // Colisión básica AABB
                if (player.x < plat.x + plat.w &&
                    player.x + player.width > plat.x &&
                    player.y < plat.y + plat.h &&
                    player.y + player.height > plat.y) {
                    
                    // Solo colisión desde arriba para saltar
                    if (player.velY > 0 && player.y + player.height - player.velY <= plat.y) {
                        player.grounded = true;
                        player.velY = 0;
                        player.y = plat.y - player.height;
                    }
                }
            }

            if (player.grounded && keys.up) {
                player.velY = -player.jumpStrength;
                player.grounded = false;
            }

            player.x += player.velX;
            player.y += player.velY;

            // Monedas
            coins.forEach(coin => {
                if (!coin.collected) {
                    let dx = (player.x + player.width/2) - (coin.x + 10);
                    let dy = (player.y + player.height/2) - (coin.y + 10);
                    let dist = Math.sqrt(dx*dx + dy*dy);
                    if (dist < 25) {
                        coin.collected = true;
                        score++;
                        coinDisplay.innerText = score;
                    }
                }
            });

            // Meta
            if (player.x < goal.x + goal.w &&
                player.x + player.width > goal.x &&
                player.y < goal.y + goal.h &&
                player.y + player.height > goal.y) {
                showMessage("¡Victoria!", `Has llegado a la meta con ${score} monedas.`);
            }

            // Caída al vacío
            if (player.y > canvas.height) {
                showMessage("¡Oops!", "Te has caído pal coño.");
            }

            // Límites laterales simples
            if (player.x < 0) player.x = 0;
            if (player.x + player.width > canvas.width) player.x = canvas.width - player.width;
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Nubes/Fondo decorativo
            ctx.fillStyle = "rgba(255,255,255,0.5)";
            ctx.beginPath(); ctx.arc(100, 100, 30, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.arc(140, 100, 40, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.arc(180, 100, 30, 0, Math.PI*2); ctx.fill();

            // Dibujar Plataformas
            ctx.fillStyle = "#4a5568";
            platforms.forEach(plat => {
                ctx.beginPath();
                ctx.roundRect(plat.x, plat.y, plat.w, plat.h, 8);
                ctx.fill();
                // Detalle de pasto
                ctx.fillStyle = "#48bb78";
                ctx.fillRect(plat.x, plat.y, plat.w, 8);
                ctx.fillStyle = "#4a5568";
            });

            // Dibujar Monedas
            coins.forEach(coin => {
                if (!coin.collected) {
                    ctx.fillStyle = "#ecc94b";
                    ctx.beginPath();
                    ctx.arc(coin.x + 10, coin.y + 10, 10, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.strokeStyle = "#b7791f";
                    ctx.lineWidth = 2;
                    ctx.stroke();
                }
            });

            // Dibujar Meta
            ctx.fillStyle = "#f56565";
            ctx.fillRect(goal.x, goal.y, 5, goal.h); // Poste
            ctx.beginPath();
            ctx.moveTo(goal.x + 5, goal.y);
            ctx.lineTo(goal.x + 35, goal.y + 15);
            ctx.lineTo(goal.x + 5, goal.y + 30);
            ctx.fill();

            // Dibujar Jugador
            ctx.fillStyle = player.color;
            ctx.beginPath();
            ctx.roundRect(player.x, player.y, player.width, player.height, 6);
            ctx.fill();
            // Ojos
            // ctx.fillStyle = "white";
            // ctx.fillRect(player.x + 18, player.y + 8, 6, 6);
            // ctx.fillStyle = "black";
            // ctx.fillRect(player.x + 22, player.y + 10, 3, 3);
        }

        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        window.onload = () => {
            initLevel();
            gameLoop();
        };
    </script>
</body>
</html>
